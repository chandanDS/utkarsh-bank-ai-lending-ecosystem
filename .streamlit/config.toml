[theme]
base = "light"
primaryColor = "#4B2E83"
backgroundColor = "#F7F9FC"
secondaryBackgroundColor = "#EDF2F7"
textColor = "#172B4D"
linkColor = "#4B2E83"
borderColor = "#D7E0EA"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "8px"
buttonRadius = "8px"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap"
baseFontSize = 15
headingFontSizes = ["34px", "26px", "21px", "17px", "15px", "13px"]
headingFontWeights = [700, 650, 600, 600, 600, 600]
chartCategoricalColors = ["#4B2E83", "#E97924", "#315CA8", "#00A6A6", "#16A34A", "#DC2626", "#64748B"]
greenColor = "#15803D"
yellowColor = "#CA8A04"
orangeColor = "#C2410C"
redColor = "#B91C1C"
blueColor = "#315CA8"
violetColor = "#6D28D9"
grayColor = "#64748B"
dataframeBorderColor = "#D7E0EA"
dataframeHeaderBackgroundColor = "#E7EEF6"

[theme.sidebar]
backgroundColor = "#2F2154"
secondaryBackgroundColor = "#432F73"
textColor = "#F8FAFC"
primaryColor = "#F2A15F"
borderColor = "#5A458A"
